<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地下室</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #c8b8a0;
    font-family: 'Noto Serif SC', serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* flickering overlay */
  .flicker {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 100;
    background: transparent;
    animation: flicker 4s infinite;
  }
  @keyframes flicker {
    0%, 96%, 100% { opacity: 0; }
    97% { opacity: 0.03; background: #fff; }
    98% { opacity: 0; }
    99% { opacity: 0.015; background: #fff; }
  }

  /* vignette */
  .vignette {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 99;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.8) 100%);
  }

  /* grain */
  .grain {
    position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
    pointer-events: none; z-index: 98; opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    animation: grain 0.5s steps(1) infinite;
  }
  @keyframes grain {
    0% { transform: translate(0, 0); }
    25% { transform: translate(-2%, 3%); }
    50% { transform: translate(1%, -1%); }
    75% { transform: translate(-1%, 2%); }
    100% { transform: translate(2%, -2%); }
  }

  #game {
    max-width: 640px;
    margin: 0 auto;
    padding: 60px 30px 80px;
    position: relative;
    z-index: 1;
  }

  /* scene image area */
  #scene-visual {
    width: 100%;
    height: 220px;
    margin-bottom: 30px;
    border: 1px solid #2a2218;
    position: relative;
    overflow: hidden;
    background: #0d0b08;
  }
  #scene-visual canvas { width: 100%; height: 100%; display: block; }

  /* narrative text */
  #narrative {
    line-height: 2;
    font-size: 16px;
    letter-spacing: 0.5px;
    min-height: 200px;
    margin-bottom: 30px;
  }
  #narrative p {
    margin-bottom: 16px;
    opacity: 0;
    animation: fadeIn 0.8s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }

  .highlight {
    color: #e8c170;
    text-shadow: 0 0 8px rgba(232,193,112,0.3);
  }
  .danger {
    color: #c44;
    text-shadow: 0 0 8px rgba(204,68,68,0.3);
  }
  .whisper {
    color: #776;
    font-style: italic;
  }
  .sound {
    color: #8899aa;
    font-family: monospace;
    letter-spacing: 3px;
    text-align: center;
    display: block;
    margin: 20px 0;
    opacity: 0.7;
  }

  /* choices */
  #choices {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 30px;
  }
  .choice-btn {
    background: rgba(30, 25, 18, 0.8);
    border: 1px solid #3a3020;
    color: #c8b8a0;
    padding: 16px 20px;
    font-family: 'Noto Serif SC', serif;
    font-size: 15px;
    cursor: pointer;
    text-align: left;
    transition: all 0.3s;
    line-height: 1.6;
    position: relative;
    overflow: hidden;
  }
  .choice-btn::before {
    content: '';
    position: absolute; left: 0; top: 0; width: 3px; height: 100%;
    background: #c44;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .choice-btn:hover {
    background: rgba(45, 35, 20, 0.9);
    border-color: #5a4a30;
    padding-left: 26px;
  }
  .choice-btn:hover::before { opacity: 1; }
  .choice-btn .num {
    color: #665;
    margin-right: 8px;
    font-size: 13px;
  }

  /* title screen */
  #title-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
  }
  #title-screen h1 {
    font-size: 48px;
    color: #8b0000;
    text-shadow: 0 0 30px rgba(139,0,0,0.5), 0 0 60px rgba(139,0,0,0.2);
    letter-spacing: 12px;
    margin-bottom: 10px;
    animation: breathe 4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.7; text-shadow: 0 0 30px rgba(139,0,0,0.3); }
    50% { opacity: 1; text-shadow: 0 0 40px rgba(139,0,0,0.6), 0 0 80px rgba(139,0,0,0.2); }
  }
  #title-screen .subtitle {
    color: #554;
    font-size: 14px;
    letter-spacing: 4px;
    margin-bottom: 60px;
  }
  #start-btn {
    background: transparent;
    border: 1px solid #5a3020;
    color: #8b4030;
    padding: 14px 40px;
    font-family: 'Noto Serif SC', serif;
    font-size: 16px;
    cursor: pointer;
    letter-spacing: 6px;
    transition: all 0.5s;
  }
  #start-btn:hover {
    background: rgba(139, 0, 0, 0.1);
    border-color: #8b4030;
    color: #c44;
    text-shadow: 0 0 10px rgba(204,68,68,0.3);
  }

  /* ending screen */
  #ending {
    display: none;
    text-align: center;
    padding-top: 120px;
  }
  #ending h2 {
    font-size: 28px;
    color: #8b0000;
    letter-spacing: 4px;
    margin-bottom: 20px;
  }
  #ending p {
    color: #665;
    line-height: 2;
    margin-bottom: 30px;
  }
  #ending .restart-btn {
    background: transparent;
    border: 1px solid #3a3020;
    color: #8b4030;
    padding: 12px 30px;
    font-family: 'Noto Serif SC', serif;
    font-size: 14px;
    cursor: pointer;
    letter-spacing: 3px;
  }
  #ending .restart-btn:hover {
    border-color: #8b4030;
    background: rgba(139,0,0,0.1);
  }

  /* heartbeat pulse on body */
  .heartbeat {
    animation: heartbeat 0.8s ease-in-out;
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.015); }
    30% { transform: scale(1); }
    45% { transform: scale(1.01); }
  }

  /* blood drip */
  .blood-drip {
    position: fixed; top: -20px; width: 2px; height: 0;
    background: #8b0000; z-index: 101; pointer-events: none;
    animation: drip 3s ease-in forwards;
  }
  @keyframes drip {
    0% { height: 0; top: -20px; opacity: 1; }
    80% { height: 60vh; top: 60vh; opacity: 0.8; }
    100% { height: 60vh; top: 100vh; opacity: 0; }
  }

  /* status bar */
  #status {
    position: fixed; bottom: 0; left: 0; width: 100%;
    padding: 12px 30px;
    background: rgba(10,10,10,0.95);
    border-top: 1px solid #1a1510;
    display: flex; justify-content: space-between;
    font-size: 12px; color: #443;
    z-index: 50;
    letter-spacing: 1px;
  }
  #status .sanity-bar {
    width: 120px; height: 6px;
    background: #1a1510;
    display: inline-block;
    vertical-align: middle;
    margin-left: 8px;
    position: relative;
    overflow: hidden;
  }
  #status .sanity-fill {
    height: 100%;
    background: #8b4030;
    width: 100%;
    transition: width 0.8s;
  }

  .hidden { display: none !important; }

  /* screen shake */
  .shake {
    animation: shake 0.4s ease-in-out;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px) rotate(-0.5deg); }
    40% { transform: translateX(5px) rotate(0.3deg); }
    60% { transform: translateX(-3px) rotate(-0.2deg); }
    80% { transform: translateX(2px); }
  }

  @media (max-width: 480px) {
    #game { padding: 40px 18px 70px; }
    #narrative { font-size: 15px; }
    #title-screen h1 { font-size: 36px; }
  }
</style>
</head>
<body>

<div class="flicker"></div>
<div class="vignette"></div>
<div class="grain"></div>

<div id="title-screen">
  <h1>地 下 室</h1>
  <div class="subtitle">你 不 记 得 怎 么 到 的 这 里</div>
  <button id="start-btn" onclick="startGame()">进 入</button>
</div>

<div id="game" class="hidden">
  <div id="scene-visual"><canvas id="canvas"></canvas></div>
  <div id="narrative"></div>
  <div id="choices"></div>
</div>

<div id="ending">
  <h2 id="ending-title"></h2>
  <p id="ending-text"></p>
  <button class="restart-btn" onclick="location.reload()">再 来 一 次</button>
</div>

<div id="status" class="hidden">
  <span>理智</span>
  <span>
    <span class="sanity-bar"><span class="sanity-fill" id="sanity-fill"></span></span>
    <span id="sanity-num">100</span>
  </span>
</div>

<script>
// ===== Audio Engine =====
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function ensureAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

function playTone(freq, dur, type='sine', vol=0.08) {
  ensureAudio();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}

function playDrip() {
  playTone(800 + Math.random()*400, 0.15, 'sine', 0.03);
  setTimeout(() => playTone(600, 0.08, 'sine', 0.02), 100);
}

function playFootstep() {
  playTone(80 + Math.random()*40, 0.2, 'triangle', 0.06);
  setTimeout(() => playTone(60, 0.15, 'triangle', 0.04), 100);
}

function playScrape() {
  ensureAudio();
  const bufSize = audioCtx.sampleRate * 0.8;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.3));
  }
  const src = audioCtx.createBufferSource();
  const g = audioCtx.createGain();
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'bandpass'; filt.frequency.value = 2000; filt.Q.value = 3;
  src.buffer = buf;
  g.gain.value = 0.04;
  src.connect(filt); filt.connect(g); g.connect(audioCtx.destination);
  src.start();
}

function playHeartbeat() {
  playTone(50, 0.15, 'sine', 0.12);
  setTimeout(() => playTone(55, 0.12, 'sine', 0.1), 180);
}

function playAmbient() {
  ensureAudio();
  const o1 = audioCtx.createOscillator();
  const o2 = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o1.type = 'sine'; o1.frequency.value = 55;
  o2.type = 'sine'; o2.frequency.value = 55.5; // slight detune for unease
  g.gain.value = 0.015;
  o1.connect(g); o2.connect(g); g.connect(audioCtx.destination);
  o1.start(); o2.start();
  return { o1, o2, g, stop: () => { g.gain.value = 0; o1.stop(); o2.stop(); } };
}

function playDoorCreak() {
  ensureAudio();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(100, audioCtx.currentTime);
  o.frequency.linearRampToValueAtTime(300, audioCtx.currentTime + 0.3);
  o.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.6);
  g.gain.setValueAtTime(0.03, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + 0.7);
}

function playDistantWhisper() {
  ensureAudio();
  for (let i = 0; i < 3; i++) {
    setTimeout(() => {
      playTone(300 + Math.random()*200, 0.3, 'sine', 0.015);
    }, i * 200 + Math.random() * 100);
  }
}

// ===== Canvas Scene Renderer =====
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let animFrame;

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * 2;
  canvas.height = rect.height * 2;
}
window.addEventListener('resize', resizeCanvas);

let particles = [];
let flickerIntensity = 0;

function drawBasementScene(time) {
  resizeCanvas();
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#0d0b08';
  ctx.fillRect(0, 0, w, h);

  // walls
  const grd = ctx.createLinearGradient(0, 0, 0, h);
  grd.addColorStop(0, '#1a1510');
  grd.addColorStop(0.6, '#12100c');
  grd.addColorStop(1, '#0a0808');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, w, h);

  // brick pattern
  ctx.strokeStyle = 'rgba(40,30,20,0.3)';
  ctx.lineWidth = 1;
  for (let y = 0; y < h; y += 30) {
    const offset = (Math.floor(y / 30) % 2) * 30;
    for (let x = offset; x < w; x += 60) {
      ctx.strokeRect(x, y, 60, 30);
    }
  }

  // water stain on floor
  ctx.fillStyle = 'rgba(20,25,30,0.4)';
  ctx.beginPath();
  ctx.ellipse(w * 0.5, h * 0.85, w * 0.3, h * 0.08, 0, 0, Math.PI * 2);
  ctx.fill();

  // pipe
  ctx.fillStyle = '#2a2820';
  ctx.fillRect(w * 0.35, 0, 8, h * 0.3);
  // drip
  const dripY = (time * 0.0003 % 1) * h * 0.4 + h * 0.3;
  ctx.fillStyle = `rgba(100,120,130,${0.6 - (dripY - h*0.3) / (h*0.5)})`;
  ctx.beginPath();
  ctx.ellipse(w * 0.354, dripY, 3, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // table
  ctx.fillStyle = '#1e1a12';
  ctx.fillRect(w * 0.3, h * 0.5, w * 0.4, 6);
  ctx.fillStyle = '#161210';
  ctx.fillRect(w * 0.35, h * 0.5 + 6, 6, h * 0.25);
  ctx.fillRect(w * 0.6, h * 0.5 + 6, 6, h * 0.25);

  // items on table
  // scissors
  ctx.strokeStyle = '#6a5a30';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(w*0.42, h*0.48);
  ctx.lineTo(w*0.46, h*0.52);
  ctx.moveTo(w*0.44, h*0.48);
  ctx.lineTo(w*0.42, h*0.52);
  ctx.stroke();

  // box
  ctx.fillStyle = '#2a2218';
  ctx.fillRect(w * 0.52, h * 0.46, w * 0.08, h * 0.06);
  ctx.strokeStyle = '#4a3a20';
  ctx.strokeRect(w * 0.52, h * 0.46, w * 0.08, h * 0.06);

  // door light crack
  ctx.fillStyle = 'rgba(180,140,60,0.15)';
  ctx.fillRect(w - 6, h * 0.2, 3, h * 0.6);

  // glow from door
  const glowGrd = ctx.createRadialGradient(w, h * 0.5, 0, w, h * 0.5, w * 0.3);
  glowGrd.addColorStop(0, 'rgba(180,140,60,0.06)');
  glowGrd.addColorStop(1, 'transparent');
  ctx.fillStyle = glowGrd;
  ctx.fillRect(w * 0.7, 0, w * 0.3, h);

  // dust particles
  if (particles.length < 20) {
    particles.push({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random()-0.5)*0.3, vy: -Math.random()*0.2 - 0.1,
      size: Math.random()*2+0.5, alpha: Math.random()*0.3
    });
  }
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
    if (p.x < -10 || p.x > w + 10) { p.x = Math.random() * w; }
    ctx.fillStyle = `rgba(200,180,150,${p.alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });

  // occasional flicker
  if (Math.random() < 0.005) flickerIntensity = 0.08;
  if (flickerIntensity > 0) {
    ctx.fillStyle = `rgba(255,255,240,${flickerIntensity})`;
    ctx.fillRect(0, 0, w, h);
    flickerIntensity *= 0.85;
  }
}

function drawSilhouetteScene(time) {
  resizeCanvas();
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#0d0b08';
  ctx.fillRect(0, 0, w, h);

  // corridor walls
  ctx.fillStyle = '#151210';
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(w*0.15, h*0.15);
  ctx.lineTo(w*0.15, h*0.85); ctx.lineTo(0, h);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(w, 0); ctx.lineTo(w*0.85, h*0.15);
  ctx.lineTo(w*0.85, h*0.85); ctx.lineTo(w, h);
  ctx.fill();

  // floor tiles
  ctx.strokeStyle = 'rgba(30,25,18,0.3)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 8; i++) {
    const y = h * 0.2 + i * (h * 0.08);
    ctx.beginPath();
    ctx.moveTo(w*0.15 + i*10, y);
    ctx.lineTo(w*0.85 - i*10, y);
    ctx.stroke();
  }

  // light source at end
  const grd = ctx.createRadialGradient(w*0.5, h*0.4, 0, w*0.5, h*0.4, w*0.3);
  grd.addColorStop(0, 'rgba(180,140,60,0.12)');
  grd.addColorStop(1, 'transparent');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, w, h);

  // figure silhouette
  const sway = Math.sin(time * 0.001) * 3;
  ctx.fillStyle = '#0a0808';
  // head
  ctx.beginPath();
  ctx.ellipse(w*0.5 + sway, h*0.28, w*0.04, h*0.06, 0, 0, Math.PI*2);
  ctx.fill();
  // body
  ctx.fillRect(w*0.47 + sway, h*0.34, w*0.06, h*0.35);
  // arms
  ctx.save();
  ctx.translate(w*0.47 + sway, h*0.4);
  ctx.rotate(-0.2 + Math.sin(time*0.0008)*0.1);
  ctx.fillRect(0, 0, w*0.04, h*0.2);
  ctx.restore();
  ctx.save();
  ctx.translate(w*0.53 + sway, h*0.4);
  ctx.rotate(0.2 - Math.sin(time*0.0008)*0.1);
  ctx.fillRect(-w*0.04, 0, w*0.04, h*0.2);
  ctx.restore();

  // floor moisture
  ctx.fillStyle = 'rgba(30,35,40,0.3)';
  ctx.beginPath();
  ctx.ellipse(w*0.5, h*0.85, w*0.15, h*0.05, 0, 0, Math.PI*2);
  ctx.fill();

  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.y < -10) { p.y = h+10; p.x = Math.random()*w; }
    ctx.fillStyle = `rgba(200,180,150,${p.alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
  });
}

function drawDarkScene(time) {
  resizeCanvas();
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#060505';
  ctx.fillRect(0, 0, w, h);

  // barely visible walls
  ctx.strokeStyle = 'rgba(25,20,15,0.3)';
  ctx.strokeRect(w*0.1, h*0.1, w*0.8, h*0.8);

  // single faint light
  const grd = ctx.createRadialGradient(w*0.5, h*0.3, 0, w*0.5, h*0.3, w*0.15);
  grd.addColorStop(0, 'rgba(100,80,40,0.08)');
  grd.addColorStop(1, 'transparent');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, w, h);
}

let currentScene = 'basement';
let sceneTime = 0;

function renderScene() {
  sceneTime += 16;
  switch(currentScene) {
    case 'basement': drawBasementScene(sceneTime); break;
    case 'silhouette': drawSilhouetteScene(sceneTime); break;
    case 'dark': drawDarkScene(sceneTime); break;
  }
  animFrame = requestAnimationFrame(renderScene);
}

// ===== Game State =====
let sanity = 100;
let inventory = [];
let flags = {};
let currentSceneId = '';

function updateSanity(val) {
  sanity = Math.max(0, Math.min(100, sanity + val));
  document.getElementById('sanity-fill').style.width = sanity + '%';
  document.getElementById('sanity-num').textContent = sanity;
  if (val < 0) {
    document.getElementById('game').classList.add('heartbeat');
    setTimeout(() => document.getElementById('game').classList.remove('heartbeat'), 800);
    playHeartbeat();
  }
}

function typeText(el, html, callback) {
  el.innerHTML = '';
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  const fullText = tmp.textContent;
  const fullHTML = tmp.innerHTML;

  let i = 0;
  let inTag = false;
  const span = document.createElement('span');
  el.appendChild(span);

  function type() {
    if (i < fullText.length) {
      span.textContent = fullText.substring(0, i + 1);
      i++;
      const speed = fullText[i-1] === '。' || fullText[i-1] === '……' ? 80 :
                     fullText[i-1] === '，' ? 40 :
                     fullText[i-1] === '\n' ? 60 : 28;
      setTimeout(type, speed);
    } else {
      // now set full HTML with formatting
      el.innerHTML = html;
      if (callback) callback();
    }
  }
  type();
}

function showChoices(choices) {
  const container = document.getElementById('choices');
  container.innerHTML = '';
  choices.forEach((c, idx) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="num">[${String.fromCharCode(65+idx)}]</span>${c.text}`;
    btn.onclick = () => {
      container.innerHTML = '';
      if (c.sanity) updateSanity(c.sanity);
      if (c.item) inventory.push(c.item);
      if (c.flag) flags[c.flag] = true;
      if (c.sound) c.sound();
      if (c.scene) currentScene = c.scene;
      setTimeout(() => scenes[c.next](), 300);
    };
    btn.style.animationDelay = (idx * 0.15) + 's';
    btn.style.opacity = '0';
    btn.style.animation = `fadeIn 0.6s ${idx * 0.15}s forwards`;
    container.appendChild(btn);
  });
}

function playDripLoop() {
  setInterval(() => {
    if (Math.random() < 0.3) playDrip();
  }, 2000);
}

function addBloodDrip() {
  const drip = document.createElement('div');
  drip.className = 'blood-drip';
  drip.style.left = (Math.random() * 100) + '%';
  document.body.appendChild(drip);
  setTimeout(() => drip.remove(), 3500);
}

// === Ending ===
function endGame(title, text) {
  document.getElementById('game').classList.add('hidden');
  document.getElementById('status').classList.add('hidden');
  const end = document.getElementById('ending');
  end.style.display = 'block';
  document.getElementById('ending-title').textContent = title;
  document.getElementById('ending-text').textContent = text;
}

// === Start ===
function startGame() {
  ensureAudio();
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('status').classList.remove('hidden');
  renderScene();
  setTimeout(() => scenes.intro(), 500);
}
