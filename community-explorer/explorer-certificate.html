<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社区探索家证书</title>
<style>
  @page {
    size: A4 landscape;
    margin: 0;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    background: #f5f5f5;
    color: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .certificate-page {
    width: 297mm;
    height: 210mm;
    background: #FFFDF7;
    position: relative;
    overflow: hidden;
  }

  /* ========== 外边框 ========== */
  .outer-border {
    position: absolute;
    top: 10mm;
    left: 10mm;
    right: 10mm;
    bottom: 10mm;
    border: 3px solid #B8963E;
    border-radius: 6px;
  }

  .inner-border {
    position: absolute;
    top: 14mm;
    left: 14mm;
    right: 14mm;
    bottom: 14mm;
    border: 1.5px solid #B8963E;
    border-radius: 3px;
  }

  /* ========== 四角花纹 ========== */
  .corner-decor {
    position: absolute;
    width: 40mm;
    height: 40mm;
    pointer-events: none;
  }
  .corner-decor svg { width: 100%; height: 100%; }
  .corner-tl { top: 8mm; left: 8mm; }
  .corner-tr { top: 8mm; right: 8mm; transform: scaleX(-1); }
  .corner-bl { bottom: 8mm; left: 8mm; transform: scaleY(-1); }
  .corner-br { bottom: 8mm; right: 8mm; transform: scale(-1,-1); }

  /* ========== 顶部彩带装饰 ========== */
  .ribbon-top {
    position: absolute;
    top: 22mm;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    width: 240mm;
    justify-content: center;
  }
  .ribbon-line {
    flex: 1;
    height: 1.5px;
    background: linear-gradient(90deg, transparent, #B8963E, transparent);
  }
  .ribbon-dot {
    width: 7px;
    height: 7px;
    background: #B8963E;
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  /* ========== 主标题区 ========== */
  .title-area {
    position: absolute;
    top: 32mm;
    left: 0;
    width: 100%;
    text-align: center;
  }
  .main-title {
    font-size: 48px;
    font-weight: 900;
    letter-spacing: 12px;
    color: #B8963E;
    text-shadow: 2px 2px 0 rgba(184,150,62,0.08);
  }
  .sub-title {
    font-size: 14px;
    letter-spacing: 6px;
    color: #A08A50;
    margin-top: 3mm;
    font-style: italic;
  }

  /* ========== 正文区 ========== */
  .body-area {
    position: absolute;
    top: 70mm;
    left: 50mm;
    right: 50mm;
    text-align: center;
  }
  .body-text {
    font-size: 17px;
    line-height: 2.8;
    color: #444;
    letter-spacing: 1.5px;
  }
  .name-line {
    display: inline-block;
    min-width: 70mm;
    border-bottom: 2px solid #B8963E;
    margin: 0 4px;
    padding-bottom: 2px;
    font-weight: 700;
    color: #333;
    font-size: 20px;
  }
  .br { display: block; height: 0; }
  .hl { color: #B8963E; font-weight: 700; font-size: 19px; }

  /* ========== 底部签名区 ========== */
  .sign-area {
    position: absolute;
    bottom: 28mm;
    left: 55mm;
    right: 55mm;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .sign-item {
    text-align: center;
  }
  .sign-label {
    font-size: 13px;
    color: #777;
    letter-spacing: 1px;
    margin-bottom: 2mm;
  }
  .sign-line {
    display: inline-block;
    width: 55mm;
    border-bottom: 1.5px solid #999;
  }
  .sign-line.short {
    width: 45mm;
  }

  /* ========== 印章 ========== */
  .stamp {
    position: absolute;
    bottom: 30mm;
    right: 50mm;
    width: 30mm;
    height: 30mm;
    border: 3px solid #C4433F;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: rotate(-12deg);
    opacity: 0.6;
  }
  .stamp-inner {
    width: 25mm;
    height: 25mm;
    border: 1.5px solid #C4433F;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stamp-text {
    font-size: 13px;
    font-weight: 900;
    color: #C4433F;
    letter-spacing: 1px;
    text-align: center;
    line-height: 1.4;
  }

  /* ========== 底部装饰线 ========== */
  .bottom-ribbon {
    position: absolute;
    bottom: 18mm;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    width: 220mm;
    justify-content: center;
  }
  .bottom-ribbon .bline {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, #B8963E, transparent);
    opacity: 0.4;
  }
  .bottom-ribbon .bdot {
    width: 5px;
    height: 5px;
    background: #B8963E;
    border-radius: 50%;
    opacity: 0.35;
    flex-shrink: 0;
  }

  /* ========== 打印 ========== */
  @media print {
    body { background: none; }
    .certificate-page { box-shadow: none; }
  }
</style>
</head>
<body>

<div class="certificate-page">

  <!-- 边框 -->
  <div class="outer-border"></div>
  <div class="inner-border"></div>

  <!-- 四角花纹 -->
  <div class="corner-decor corner-tl">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M5,5 Q5,50 50,50 Q5,50 5,95" stroke="#B8963E" stroke-width="1.5" fill="none" opacity="0.35"/>
      <path d="M5,5 C25,5 30,20 30,30 C30,20 35,5 55,5" stroke="#B8963E" stroke-width="1" fill="none" opacity="0.25"/>
      <circle cx="18" cy="18" r="3" fill="#B8963E" opacity="0.2"/>
    </svg>
  </div>
  <div class="corner-decor corner-tr">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M5,5 Q5,50 50,50 Q5,50 5,95" stroke="#B8963E" stroke-width="1.5" fill="none" opacity="0.35"/>
      <path d="M5,5 C25,5 30,20 30,30 C30,20 35,5 55,5" stroke="#B8963E" stroke-width="1" fill="none" opacity="0.25"/>
      <circle cx="18" cy="18" r="3" fill="#B8963E" opacity="0.2"/>
    </svg>
  </div>
  <div class="corner-decor corner-bl">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M5,5 Q5,50 50,50 Q5,50 5,95" stroke="#B8963E" stroke-width="1.5" fill="none" opacity="0.35"/>
      <path d="M5,5 C25,5 30,20 30,30 C30,20 35,5 55,5" stroke="#B8963E" stroke-width="1" fill="none" opacity="0.25"/>
      <circle cx="18" cy="18" r="3" fill="#B8963E" opacity="0.2"/>
    </svg>
  </div>
  <div class="corner-decor corner-br">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M5,5 Q5,50 50,50 Q5,50 5,95" stroke="#B8963E" stroke-width="1.5" fill="none" opacity="0.35"/>
      <path d="M5,5 C25,5 30,20 30,30 C30,20 35,5 55,5" stroke="#B8963E" stroke-width="1" fill="none" opacity="0.25"/>
      <circle cx="18" cy="18" r="3" fill="#B8963E" opacity="0.2"/>
    </svg>
  </div>

  <!-- 顶部彩带 -->
  <div class="ribbon-top">
    <span class="ribbon-line"></span>
    <span class="ribbon-dot"></span>
    <span class="ribbon-dot"></span>
    <span class="ribbon-dot"></span>
    <span class="ribbon-line"></span>
  </div>

  <!-- 标题 -->
  <div class="title-area">
    <div class="main-title">社区探索家证书</div>
    <div class="sub-title">Community Explorer Certificate</div>
  </div>

  <!-- 正文 -->
  <div class="body-area">
    <div class="body-text">
      兹证明
      <span class="name-line"></span>
      <span class="br"></span>
      在"社区探索家"系列活动中
      <span class="br"></span>
      完成了 <span class="hl">6</span> 次社区探索
      <span class="br"></span>
      学会了 <span class="hl">观察</span>、<span class="hl">访谈</span>、<span class="hl">记录</span> 和 <span class="hl">行动</span>
      <span class="br"></span>
      正式成为一位 <span class="hl">社区探索家</span> ！
    </div>
  </div>

  <!-- 签名区 -->
  <div class="sign-area">
    <div class="sign-item">
      <div class="sign-label">日期</div>
      <span class="sign-line"></span>
    </div>
    <div class="sign-item">
      <div class="sign-label">颁发人（签章）</div>
      <span class="sign-line"></span>
    </div>
  </div>

  <!-- 印章 -->
  <div class="stamp">
    <div class="stamp-inner">
      <div class="stamp-text">社区<br>探索家</div>
    </div>
  </div>

  <!-- 底部装饰 -->
  <div class="bottom-ribbon">
    <span class="bline"></span>
    <span class="bdot"></span>
    <span class="bdot"></span>
    <span class="bline"></span>
  </div>

</div>

</body>
</html>
