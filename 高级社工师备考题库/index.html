<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高级社工师备考题库</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #2563eb; --primary-light: #dbeafe; --primary-dark: #1d4ed8;
  --success: #16a34a; --success-light: #dcfce7;
  --danger: #dc2626; --danger-light: #fee2e2;
  --warning: #d97706; --warning-light: #fef3c7;
  --gray-50: #f9fafb; --gray-100: #f3f4f6; --gray-200: #e5e7eb;
  --gray-300: #d1d5db; --gray-500: #6b7280; --gray-700: #374151;
  --gray-800: #1f2937; --gray-900: #111827;
  --radius: 12px; --shadow: 0 1px 3px rgba(0,0,0,.1);
  --shadow-lg: 0 4px 12px rgba(0,0,0,.12);
}
body { font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; background: var(--gray-50); color: var(--gray-800); line-height: 1.6; }
.container { max-width: 800px; margin: 0 auto; padding: 0 16px; }

/* Header */
.header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; padding: 20px 0 16px; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-lg); }
.header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.header h1 { font-size: 20px; font-weight: 700; }
.header-stats { display: flex; gap: 12px; font-size: 12px; opacity: .9; }
.header-stats span { background: rgba(255,255,255,.15); padding: 3px 10px; border-radius: 20px; }

/* Tabs */
.tabs { display: flex; gap: 4px; background: rgba(255,255,255,.1); border-radius: 10px; padding: 3px; }
.tab { flex: 1; text-align: center; padding: 8px 0; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all .2s; color: rgba(255,255,255,.7); }
.tab.active { background: #fff; color: var(--primary); }
.tab:hover:not(.active) { background: rgba(255,255,255,.1); }
.tab .badge { background: var(--danger); color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-left: 4px; vertical-align: middle; }

/* Content */
.content { padding: 16px 0 80px; }
.page { display: none; }
.page.active { display: block; }

/* Cards */
.card { background: #fff; border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.card-title { font-size: 15px; font-weight: 600; }
.card-meta { font-size: 12px; color: var(--gray-500); }

/* Tags */
.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
.tag-case { background: var(--primary-light); color: var(--primary); }
.tag-essay { background: #fce7f3; color: #be185d; }
.tag-theory { background: var(--success-light); color: var(--success); }
.tag-policy { background: var(--warning-light); color: var(--warning); }
.tag-year { background: var(--gray-100); color: var(--gray-700); }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 4px; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; border: none; cursor: pointer; transition: all .15s; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-success { background: var(--success); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #b91c1c; }
.btn-outline { background: #fff; color: var(--gray-700); border: 1px solid var(--gray-300); }
.btn-outline:hover { background: var(--gray-100); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-block { width: 100%; justify-content: center; }

/* Question List */
.q-list-item { padding: 14px 0; border-bottom: 1px solid var(--gray-100); cursor: pointer; transition: background .1s; }
.q-list-item:last-child { border-bottom: none; }
.q-list-item:hover { background: var(--gray-50); }
.q-list-item .q-title { font-size: 14px; font-weight: 500; line-height: 1.5; margin-bottom: 6px; }
.q-list-item .q-meta { display: flex; gap: 8px; flex-wrap: wrap; }

/* Question Detail */
.question-view { display: none; }
.question-view.active { display: block; }
.q-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.q-number { font-size: 13px; color: var(--gray-500); margin-bottom: 4px; }
.q-type-badge { font-size: 12px; padding: 3px 10px; border-radius: 6px; font-weight: 600; }
.q-body { font-size: 15px; line-height: 1.8; white-space: pre-wrap; }
.q-body p { margin-bottom: 8px; }
.q-requirements { background: var(--gray-50); border-left: 3px solid var(--primary); padding: 12px 16px; margin: 12px 0; border-radius: 0 8px 8px 0; font-size: 14px; line-height: 1.8; }
.q-requirements strong { color: var(--primary); }

/* Answer Area */
.answer-area { margin-top: 16px; }
.answer-area textarea { width: 100%; min-height: 200px; padding: 12px; border: 1px solid var(--gray-200); border-radius: 8px; font-size: 14px; font-family: inherit; resize: vertical; line-height: 1.7; }
.answer-area textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }

/* Reference Answer */
.ref-answer { display: none; margin-top: 16px; background: var(--success-light); border-radius: var(--radius); padding: 16px; }
.ref-answer.show { display: block; }
.ref-answer h4 { color: var(--success); font-size: 14px; margin-bottom: 8px; }
.ref-answer .answer-content { font-size: 14px; line-height: 1.8; white-space: pre-wrap; }

/* Score Selector */
.score-selector { display: none; margin-top: 12px; padding: 12px; background: var(--warning-light); border-radius: 8px; }
.score-selector.show { display: block; }
.score-selector h5 { font-size: 13px; margin-bottom: 8px; color: var(--warning); }
.score-options { display: flex; gap: 8px; flex-wrap: wrap; }
.score-btn { padding: 6px 14px; border: 2px solid var(--gray-200); border-radius: 8px; background: #fff; cursor: pointer; font-size: 13px; font-weight: 500; transition: all .15s; }
.score-btn:hover { border-color: var(--primary); }
.score-btn.selected { border-color: var(--primary); background: var(--primary); color: #fff; }

/* Timer */
.timer-bar { display: none; background: #fff; border-radius: var(--radius); padding: 12px 16px; margin-bottom: 12px; box-shadow: var(--shadow); align-items: center; justify-content: space-between; }
.timer-bar.show { display: flex; }
.timer { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--primary); }
.timer-label { font-size: 12px; color: var(--gray-500); }

/* Progress */
.progress-bar { height: 4px; background: var(--gray-200); border-radius: 2px; margin-bottom: 12px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--primary); border-radius: 2px; transition: width .3s; }

/* Filter */
.filter-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.filter-btn { padding: 5px 12px; border: 1px solid var(--gray-200); border-radius: 20px; font-size: 12px; cursor: pointer; background: #fff; transition: all .15s; }
.filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* Stats Card */
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat-card { background: #fff; border-radius: var(--radius); padding: 14px; text-align: center; box-shadow: var(--shadow); }
.stat-number { font-size: 28px; font-weight: 700; color: var(--primary); }
.stat-label { font-size: 12px; color: var(--gray-500); margin-top: 2px; }

/* Empty State */
.empty-state { text-align: center; padding: 40px 20px; color: var(--gray-500); }
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: .5; }
.empty-state p { font-size: 14px; }

/* Back Button */
.back-btn { display: inline-flex; align-items: center; gap: 4px; color: var(--gray-500); font-size: 13px; cursor: pointer; margin-bottom: 12px; }
.back-btn:hover { color: var(--primary); }

/* Wrong Question Actions */
.wrong-actions { display: flex; gap: 8px; margin-top: 12px; }

/* Study Plan */
.plan-phase { border-left: 3px solid var(--primary); padding: 12px 16px; margin-bottom: 12px; background: #fff; border-radius: 0 var(--radius) var(--radius) 0; }
.plan-phase h4 { font-size: 14px; color: var(--primary); margin-bottom: 4px; }
.plan-phase p { font-size: 13px; color: var(--gray-500); }

/* Confirm Dialog */
.dialog-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.4); z-index: 200; align-items: center; justify-content: center; }
.dialog-overlay.show { display: flex; }
.dialog { background: #fff; border-radius: var(--radius); padding: 24px; max-width: 320px; width: 90%; text-align: center; }
.dialog h3 { font-size: 16px; margin-bottom: 8px; }
.dialog p { font-size: 14px; color: var(--gray-500); margin-bottom: 16px; }
.dialog-actions { display: flex; gap: 8px; justify-content: center; }

/* Animations */
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn .2s ease; }

/* Responsive */
@media (max-width: 640px) {
  .stats-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .stat-card { padding: 10px; }
  .stat-number { font-size: 22px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="container">
    <div class="header-top">
      <h1>高级社工师 · 备考题库</h1>
      <div class="header-stats">
        <span id="totalDone">已做 0 题</span>
        <span id="totalWrong">错题 0</span>
      </div>
    </div>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('practice')">练习</div>
      <div class="tab" onclick="switchTab('basic')">基础题库</div>
      <div class="tab" onclick="switchTab('wrong')">错题收藏 <span class="badge" id="wrongBadge" style="display:none">0</span></div>
    </div>
  </div>
</div>

<div class="container content">
  <!-- ====== PRACTICE PAGE ====== -->
  <div class="page active" id="practicePage">
    <div class="stats-grid fade-in">
      <div class="stat-card"><div class="stat-number" id="pDone">0</div><div class="stat-label">已练习</div></div>
      <div class="stat-card"><div class="stat-number" id="pAvg">0</div><div class="stat-label">平均分</div></div>
      <div class="stat-card"><div class="stat-number" id="pWrong">0</div><div class="stat-label">错题</div></div>
    </div>
    <div class="card fade-in">
      <div class="card-title" style="margin-bottom:12px">选择练习模式</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn btn-primary btn-block" onclick="startPractice('case')">案例分析专项（20分/题）</button>
        <button class="btn btn-primary btn-block" style="background:#be185d" onclick="startPractice('essay')">论述题专项（30分/题）</button>
        <button class="btn btn-outline btn-block" onclick="startPractice('all')">混合练习（随机抽取）</button>
      </div>
    </div>
    <div class="card fade-in">
      <div class="card-title" style="margin-bottom:8px">备考进度</div>
      <div class="plan-phase"><h4>第一阶段 · 基础夯实</h4><p>通读教材，搭建理论框架</p></div>
      <div class="plan-phase"><h4>第二阶段 · 专题强化</h4><p>做真题，整理错题，补理论</p></div>
      <div class="plan-phase"><h4>第三阶段 · 实战冲刺</h4><p>全真模拟，背诵模板</p></div>
    </div>
  </div>

  <!-- ====== BASIC PAGE ====== -->
  <div class="page" id="basicPage">
    <div class="filter-bar" id="filterBar">
      <div class="filter-btn active" onclick="filterYear('all')">全部</div>
      <div class="filter-btn" onclick="filterYear('2025')">2025</div>
      <div class="filter-btn" onclick="filterYear('2024')">2024</div>
      <div class="filter-btn" onclick="filterYear('2023')">2023</div>
      <div class="filter-btn" onclick="filterYear('2022')">2022</div>
      <div class="filter-btn" onclick="filterYear('2021')">2021</div>
    </div>
    <div id="questionList"></div>
  </div>

  <!-- ====== WRONG PAGE ====== -->
  <div class="page" id="wrongPage">
    <div id="wrongList"></div>
    <div class="empty-state" id="wrongEmpty">
      <div class="empty-icon">📝</div>
      <p>还没有错题收藏</p>
      <p style="font-size:12px;margin-top:4px">做题时点击"加入错题本"即可收藏</p>
    </div>
  </div>

  <!-- ====== QUESTION VIEW ====== -->
  <div class="page" id="questionView">
    <div class="timer-bar" id="timerBar">
      <div><div class="timer-label">答题计时</div><div class="timer" id="timerDisplay">00:00</div></div>
      <button class="btn btn-sm btn-outline" onclick="toggleTimer()">暂停</button>
    </div>
    <div class="back-btn" onclick="goBack()">← 返回列表</div>
    <div class="card" id="questionCard"></div>
    <div class="answer-area" id="answerArea">
      <textarea id="answerInput" placeholder="在此输入你的答案...&#10;&#10;建议先在纸上写好，再整理到此处。"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="showAnswer()">查看参考答案</button>
        <button class="btn btn-outline" id="wrongBtn" onclick="toggleWrong()">加入错题本</button>
      </div>
    </div>
    <div class="ref-answer" id="refAnswer">
      <h4>参考答案</h4>
      <div class="answer-content" id="answerContent"></div>
    </div>
    <div class="score-selector" id="scoreSelector">
      <h5>自评打分</h5>
      <div class="score-options" id="scoreOptions"></div>
    </div>
  </div>
</div>

<!-- Confirm Dialog -->
<div class="dialog-overlay" id="confirmDialog">
  <div class="dialog">
    <h3 id="dialogTitle">确认</h3>
    <p id="dialogMsg">确定要执行此操作吗？</p>
    <div class="dialog-actions">
      <button class="btn btn-outline btn-sm" onclick="closeDialog()">取消</button>
      <button class="btn btn-danger btn-sm" id="dialogConfirm" onclick="confirmAction()">确定</button>
    </div>
  </div>
</div>

<script>
// ===== QUESTION BANK =====
const questionBank = [
  // ===== 2025 =====
  {
    id: 'q2025_1', year: '2025', type: 'case', points: 20,
    title: '易地搬迁社区邻里关系与社区参与',
    body: `某易地搬迁社区居民之间交往较少，邻里关系较疏离；居民的社区参与度有待提升，社区认同感、归属感有待加强；社区内公共空间不足，居民缺少交流互动的平台和机会。社区中有留守老人、留守儿童、残疾人等特殊困难群体，他们的社会支持网络薄弱。

社工机构入驻后，计划开展社区融合服务项目。`,
    requirements: `请根据以上案例，完成以下任务：

<strong>1.</strong> 分析该社区居民面临的主要问题和需求（从个人、家庭、社区三个层面分析）。
<strong>2.</strong> 运用社区工作的方法，设计一份社区融合服务方案（包括理论依据、服务目标、介入策略、实施步骤、评估方法）。
<strong>3.</strong> 说明如何在服务中体现"助人自助"的理念。`,
    answer: `一、问题与需求分析

（一）个人层面
1. 心理适应问题：搬迁后环境变化导致焦虑、不安
2. 社会交往能力不足：缺乏主动建立关系的意识和能力
3. 特殊群体需求：留守老人孤独感强、儿童缺乏陪伴、残疾人无障碍需求

（二）家庭层面
1. 家庭支持网络断裂：离开原居住地，亲友网络缺失
2. 家庭关系压力：经济压力、子女教育问题
3. 邻里互助缺失：不了解邻居，无法互帮互助

（三）社区层面
1. 社区认同感低：对新环境缺乏归属感
2. 公共空间不足：缺少交流互动平台
3. 社区参与度低：居民对社区事务冷漠
4. 社会支持网络薄弱：缺乏组织化支持

二、社区融合服务方案

（一）理论依据
1. 生态系统理论：从微观、中观、宏观系统入手，改善居民与环境的互动
2. 社会支持理论：构建正式和非正式支持网络
3. 增能理论：提升居民自主参与社区事务的能力
4. 地区发展模式：通过居民参与和协作解决社区问题

（二）服务目标
总目标：增强社区凝聚力，建立互助支持网络，提升居民归属感
分目标：
1. 建立至少3个社区互助小组
2. 搭建社区交流平台（线上+线下）
3. 组织不少于10次社区活动
4. 培育社区骨干不少于15人

（三）介入策略
1. 个案服务：针对特殊困难群体提供精准帮扶
2. 小组工作：组建邻里互助小组、亲子活动小组、老年社交小组
3. 社区工作：打造公共空间、组织社区活动、培育社区社会组织
4. 资源链接：对接政府部门、社会组织、志愿者等资源

（四）实施步骤
第一阶段（1-2月）：需求调研、建立关系、组建核心团队
第二阶段（3-4月）：开展小组活动、搭建交流平台
第三阶段（5-6月）：组织社区活动、培育社区骨干
第四阶段（7月）：评估总结、建立长效机制

（五）评估方法
1. 过程评估：活动参与率、服务对象满意度
2. 结果评估：社区归属感量表测量、社会支持网络变化
3. 影响评估：社区自组织发展情况

三、体现"助人自助"理念

1. 赋能而非替代：引导居民自主解决问题，不包办代替
2. 培育社区骨干：让居民成为服务的参与者和推动者
3. 建立自组织：帮助居民成立互助组织，实现自我管理
4. 激发内在动力：通过成功体验增强居民信心和能力
5. 逐步退出：随着居民能力提升，社工逐步撤出`
  },
  {
    id: 'q2025_2', year: '2025', type: 'case', points: 25,
    title: '社区老年食堂运营困境',
    body: `某社区开设了老年食堂，为社区老年人提供低价午餐服务。运营半年后出现以下问题：就餐老人逐渐减少，从最初每天80人下降到30人；食堂运营亏损严重，社区资金补贴压力大；部分老人反映饭菜不合口味、营养搭配不合理；食堂工作人员积极性不高，服务质量下降；社区中有部分行动不便的独居老人无法到食堂就餐。

社区居委会找到社工机构，希望社工介入改善老年食堂运营状况。`,
    requirements: `请根据以上案例，完成以下任务：

<strong>1.</strong> 运用生态系统理论分析老年食堂运营困境的原因。
<strong>2.</strong> 设计一份改善老年食堂运营的服务方案（包括需求评估、理论框架、服务目标、介入策略、预期成效）。
<strong>3.</strong> 说明如何建立老年食堂的可持续运营机制。`,
    answer: `一、生态系统理论分析

（一）微观系统（个人层面）
1. 老人个体需求差异大：口味、营养、饮食禁忌各不相同
2. 行动不便老人存在物理障碍：无法到达食堂
3. 老人消费习惯：习惯在家做饭，外出就餐意愿低

（二）中观系统（家庭与社区层面）
1. 家庭支持：部分老人有家人做饭，不需要食堂
2. 社区互动不足：老人之间缺乏交流，独自就餐体验差
3. 志愿者参与不足：缺少送餐和陪餐服务

（三）宏观系统（制度与政策层面）
1. 补贴政策有限：政府补贴难以覆盖运营成本
2. 定价机制不合理：低价定位导致盈利困难
3. 缺乏专业管理：运营团队缺乏餐饮管理和社工专业知识

二、改善老年食堂运营服务方案

（一）需求评估
1. 问卷调查：了解老人口味偏好、用餐频率、期望价格

  {
    id: 'q2025_4', year: '2025', type: 'essay', points: 30,
    title: '专业社工+志愿服务融合发展',
    body: `近年来，国家大力推进"专业社工+志愿服务"融合发展模式，鼓励社会工作者发挥专业优势，引领志愿服务规范化、专业化发展。然而在实践中，一些地方出现了"两张皮"现象：社工和志愿者各干各的，缺乏有效协作；志愿者流动性大、专业性不足；社工对志愿服务的督导和管理能力有限。

请结合社会工作理论和实务经验，论述如何推进"专业社工+志愿服务"的深度融合，使其在基层社会治理中发挥更大作用。`,
    requirements: `要求：
<strong>1.</strong> 观点明确，论述有深度；
<strong>2.</strong> 理论与实践相结合；
<strong>3.</strong> 字数不少于800字。`,
    answer: `专业社工+志愿服务深度融合的路径探析

一、引言

"专业社工+志愿服务"融合发展是创新基层社会治理的重要举措。社工的专业性和志愿者的广泛性相结合，能够形成强大的社会服务合力。然而，当前融合发展中存在的"两张皮"问题制约了这一模式效能的发挥。本文将从理论和实践两个维度，探讨推进深度融合的有效路径。

二、理论基础

（一）协同治理理论
社工与志愿者的合作本质上是多元主体协同治理的体现。社工提供专业指导和资源整合，志愿者提供人力资源和社区参与，两者协同可以实现服务效果的最大化。

（二）增能理论
社工通过专业督导和培训，可以提升志愿者的服务能力和专业素养，实现志愿者的"增能"。同时，志愿者的参与也为社工提供了更多的服务资源和社区支持。

（三）社会支持理论
社工和志愿者共同构建的社会支持网络，能够为服务对象提供更加全面和持续的支持。

三、问题分析

（一）角色定位不清
一些地方将社工等同于志愿者管理者，忽视了社工的专业性；也有一些地方社工包办一切，未能有效发挥志愿者的作用。

（二）协作机制缺失
缺乏制度化的协作流程和沟通机制，导致信息不对称、资源浪费。

（三）专业支持不足
社工对志愿者的督导和培训不够，志愿者服务质量参差不齐。

（四）激励机制不完善
志愿者缺乏有效的激励和认可，参与积极性不高。

四、融合路径

（一）明确角色定位，建立协作框架
1. 社工定位为专业引领者：负责需求评估、方案设计、专业督导
2. 志愿者定位为服务参与者：在社工指导下开展具体服务
3. 建立清晰的职责分工和协作流程

（二）构建制度化协作机制
1. 建立联席会议制度：定期沟通、协调资源
2. 制定协作规范：明确信息共享、任务分配、反馈评估流程
3. 搭建信息化平台：实现需求发布、志愿者招募、服务记录的数字化管理

（三）强化专业督导和培训
1. 建立志愿者培训体系：岗前培训、在岗督导、专业提升
2. 社工发挥专业督导作用：定期评估、个别指导、团队建设
3. 培育志愿者骨干：发现和培养有能力的志愿者成为团队核心

（四）完善激励和认可机制
1. 建立志愿服务时间银行：记录服务时长，可兑换服务
2. 定期表彰优秀志愿者：通过荣誉激励增强归属感
3. 提供专业发展机会：优先参与社工培训、获得专业证书

（五）融入基层社会治理
1. 对接社区需求：将志愿服务与社区治理项目相结合
2. 参与社区营造：组织居民参与社区公共事务
3. 促进社区自治：通过志愿服务培育社区自组织

五、实践案例

以某社区为例，社工机构引入"专业社工+志愿服务"模式：
1. 社工对社区进行需求评估，确定服务方向
2. 招募和培训志愿者30名，组建3个专业服务队
3. 社工每月为志愿者提供专业督导和培训
4. 志愿者在社工指导下开展关爱老人、儿童托管、邻里互助等服务
5. 服务对象满意度达到90%以上，志愿者留存率达到70%

六、结论

推进"专业社工+志愿服务"深度融合，需要从制度建设、能力建设、机制建设三个维度协同发力。社工要发挥专业引领作用，志愿者要积极参与和配合，政府和社会要提供支持和保障。只有形成合力，才能在基层社会治理中发挥更大作用，真正实现"助人自助"的社会工作理念。`

<strong>3.</strong> 字数不少于800字。`,
    answer: `社工机构项目管理能力提升路径

一、引言

政府购买社会工作服务是推动社工行业发展的重要机制。然而，项目管理能力不足已成为制约机构发展的瓶颈。提升项目管理能力，不仅关系到机构的生存发展，更关系到社会工作服务质量的保障。

二、当前项目管理存在的主要问题

（一）项目设计阶段
1. 需求调研不充分：闭门造车，脱离服务对象实际需求
2. 目标设定不科学：目标过大或过于笼统，缺乏可测量性
3. 预算编制不合理：成本估算不准确，缺乏弹性

（二）项目执行阶段
1. 进度管理缺失：项目推进缺乏时间节点和里程碑
2. 质量控制薄弱：服务过程缺乏标准化和督导
3. 风险管理缺位：对可能出现的问题缺乏预案

（三）项目评估阶段
1. 过程评估不足：只关注结果，忽视过程改进
2. 成效评估不科学：缺乏科学的评估工具和方法
3. 评估结果应用不足：评估结果未能有效反馈到实践中

三、提升路径

（一）完善项目管理制度
1. 建立标准化的项目管理流程：从立项、设计、执行到评估的全流程规范
2. 制定项目管理手册：明确各环节的操作标准和要求
3. 建立项目档案管理制度：规范项目文档的收集、保存和使用

（二）加强人才培养
1. 引进具有项目管理经验的人才
2. 开展项目管理专项培训：包括需求评估、方案设计、财务管理、评估方法等
3. 建立项目管理知识库：积累项目经验和最佳实践
4. 鼓励员工考取相关资格证书（如PMP）

（三）优化项目设计
1. 深入需求调研：运用问卷、访谈、焦点小组等方法
2. 科学设定目标：遵循SMART原则
3. 合理编制预算：确保成本覆盖且有适当弹性
4. 创新服务模式：结合理论和实践，设计有特色的服务方案

（四）强化执行管理
1. 建立项目进度跟踪机制：定期检查、及时调整
2. 完善质量管理体系：制定服务标准、加强督导
3. 加强财务管理：规范预算执行、定期财务报告
4. 建立风险管理机制：识别风险、制定预案

（五）提升评估能力
1. 建立科学的评估框架：过程评估+结果评估+影响评估
2. 引入第三方评估：增强评估的客观性和公信力
3. 重视评估结果应用：将评估结论转化为改进措施

（六）加强行业协作
1. 参与行业交流：学习优秀机构的项目管理经验
2. 建立行业标准：推动项目管理规范化
3. 共享资源和信息：形成行业发展合力

四、案例分析

以某社工机构为例，通过以下措施提升了项目管理能力：
1. 引入项目管理软件，实现项目进度可视化
2. 每月召开项目管理例会，及时解决问题
3. 建立项目督导制度，确保服务质量
4. 开展项目评估培训，提升评估能力
5. 建立项目知识库，积累和分享经验

实施一年后，机构项目中标率提高30%，服务满意度达到90%以上，财务管理更加规范。

五、结论

提升社工机构项目管理能力是一个系统工程，需要从制度、人才、流程、技术等多个维度协同推进。只有不断提升项目管理能力，社工机构才能在激烈的竞争中立于不败之地，为服务对象提供更优质的专业服务。`

5. 建立希望感：相信社区有能力自我修复和成长`

  {
    id: 'q2023_4', year: '2023', type: 'essay', points: 30,
    title: '新时代社会工作的使命与担当',
    body: `党的二十大报告指出，要"完善社会治理体系""健全共建共治共享的社会治理制度"。社会工作作为社会治理的重要力量，在新时代面临着新的机遇和挑战。请结合社会工作理论和实践，论述新时代社会工作的使命与担当。`,
    requirements: `要求：
<strong>1.</strong> 观点明确，论述有深度；
<strong>2.</strong> 理论与实践相结合；
<strong>3.</strong> 字数不少于800字。`,
    answer: `新时代社会工作的使命与担当

一、引言

党的二十大报告为社会工作发展指明了方向。新时代赋予社会工作新的使命，要求社工在社会治理、民生保障、乡村振兴等领域发挥更大作用。

二、新时代社会工作的使命

（一）服务民生保障
社会工作要聚焦困难群体和特殊群体，提供专业化、精细化的服务。在养老、儿童保护、残疾人服务、社会救助等领域发挥专业优势。

（二）参与社会治理
社会工作要发挥"润滑剂"和"粘合剂"作用，促进社区参与、化解社会矛盾、增进社会和谐。在基层治理中，社工是连接政府和居民的桥梁。

（三）促进社会公平
社会工作要坚持"助人自助"理念，帮助弱势群体增能，促进社会资源的公平分配，推动社会公平正义。

（四）推动行业发展
社会工作要加强自身建设，提升专业化水平，扩大社会影响力，推动行业健康发展。

三、新时代社会工作的担当

（一）扎根基层，服务群众
社工要深入社区、深入群众，了解真实需求，提供接地气的服务。不搞花架子，不搞形式主义，实实在在为群众解决问题。

（二）专业引领，创新驱动
社工要不断提升专业能力，运用理论指导实践，创新服务模式和方法。将先进的社会工作理论与中国实际相结合，探索本土化的服务模式。

（三）协同合作，多元参与
社工要加强与政府部门、社会组织、企业、志愿者等各方的协作，形成服务合力。善于整合资源，搭建合作平台。

（四）倡导政策，推动变革
社工要发挥政策倡导功能，将基层实践中发现的问题和需求反馈给决策层，推动政策完善。通过专业影响力推动社会进步。

四、实践路径

（一）加强党建引领
将社会工作纳入基层党建格局，发挥党组织的领导核心作用，确保社会工作正确发展方向。

（二）完善制度保障
推动社会工作法律法规建设，完善职业保障、薪酬待遇、职称评定等制度。

（三）提升专业能力
加强社会工作教育和培训，完善继续教育体系，提升从业人员的专业素质。

（四）扩大服务领域
拓展社会工作在新兴领域（如企业社会工作、网络社会工作等）的服务范围。

五、结论

新时代为社会工作提供了广阔的发展空间。社会工作者要牢记初心使命，以专业的态度、扎实的能力、创新的精神，在服务民生、参与治理、促进公平等方面发挥更大作用，为全面建设社会主义现代化国家贡献专业力量。`
  },

    title: '社区老年人需求调查研究',
    body: `社会工作者受某街道委托，调查该辖区范围内老年人生活压力和社会支持状况。社工决定采用问卷调查法，计划发放500份问卷。

请帮助社工完成以下研究设计任务。`,
    requirements: `请根据以上案例，完成以下任务：

<strong>1.</strong> 确定研究问题和研究目的。
<strong>2.</strong> 设计问卷调查的研究方案（包括抽样方法、问卷设计、实施步骤）。
<strong>3.</strong> 说明如何确保研究的信度和效度。`,
    answer: `一、研究问题和研究目的

（一）研究问题
1. 该街道老年人面临的主要生活压力有哪些？
2. 老年人的社会支持网络状况如何？
3. 生活压力与社会支持之间存在什么关系？
4. 不同特征（性别、年龄、经济状况等）的老年人在压力和社会支持方面有何差异？

（二）研究目的
1. 描述性目的：全面了解街道老年人的生活压力和社会支持现状
2. 解释性目的：分析影响老年人生活质量的关键因素
3. 应用性目的：为制定老年人服务方案提供数据支持

二、问卷调查研究方案

（一）抽样方法
1. 抽样框：以街道户籍老年人名册为基础
2. 抽样方法：分层随机抽样
- 按社区分层，确保各社区均有样本
- 在各社区内随机抽取老年人
3. 样本量：500份问卷（考虑到无效问卷，实际发放550份）

（二）问卷设计
问卷结构：
1. 基本信息：性别、年龄、婚姻状况、文化程度、经济状况
2. 生活压力量表：经济压力、健康压力、心理压力、家庭压力
3. 社会支持量表：正式支持（政府、社区）、非正式支持（家人、朋友、邻居）
4. 生活满意度量表：总体满意度、各领域满意度
5. 开放性问题：最需要帮助的方面

（三）实施步骤
1. 准备阶段（第1周）：设计问卷、预调查、修改完善
2. 培训阶段（第2周）：培训调查员、统一标准
3. 实施阶段（第3-4周）：入户发放问卷、指导填写
4. 数据处理阶段（第5周）：回收、编码、录入、分析

三、信度和效度保证

（一）信度保证
1. 问卷信度：使用成熟量表，进行预调查检验内部一致性
2. 调查员信度：统一培训，标准化操作流程
3. 数据录入信度：双人录入核对

（二）效度保证
1. 内容效度：邀请专家审核问卷内容
2. 结构效度：使用已验证的成熟量表
3. 实施效度：严格控制调查过程，减少偏差
4. 三角验证：结合访谈、观察等方法进行交叉验证`

    title: '社会工作在乡村振兴中的作用',
    body: `全面推进乡村振兴是新时代"三农"工作的总抓手。社会工作在乡村振兴中可以发挥独特作用。请结合实际，论述社会工作如何助力乡村振兴。`,

<strong>3.</strong> 字数不少于800字。`,
    answer: `社会工作助力乡村振兴的路径

一、引言

乡村振兴战略涵盖产业兴旺、生态宜居、乡风文明、治理有效、生活富裕五个方面。社会工作以"助人自助"为核心理念，运用专业方法服务农村社区，在乡村振兴中具有独特优势和重要作用。

（一）服务困难群体，保障基本民生
1. 关爱留守老人和儿童：提供日常照料、心理支持
2. 帮助困难家庭：链接资源、提供救助
3. 服务残疾人和精神障碍患者：康复服务、社会融入

（二）促进产业发展，助力共同富裕
1. 扶持农村社会组织：帮助成立合作社、协会等
2. 培训农民技能：组织职业技能培训
3. 链接市场资源：帮助农产品销售、推广乡村品牌

（三）改善社区环境，建设生态宜居乡村
1. 环保意识宣传：倡导绿色生活方式
2. 社区环境治理：组织居民参与环境整治
3. 人居环境改善：推动垃圾分类、污水治理

（四）培育乡风文明，促进文化振兴
1. 传统文化保护：挖掘和传承乡土文化
2. 文明新风倡导：推动移风易俗
3. 社区文化活动：组织丰富群众文化生活

（五）参与基层治理，提升治理效能
1. 协助村委工作：提供专业支持
2. 促进村民参与：组织村民议事、协商
3. 化解矛盾纠纷：调解邻里矛盾

三、实践路径

（一）建立农村社工站
在乡镇建立社工站，配备专业社工，为农村居民提供常态化服务。

（二）培育本土社工人才
通过培训和实践，培养本土社工人才，增强农村自我服务能力。

（三）整合多方资源
政府、社会组织、企业、志愿者等多方协作，形成服务合力。

（四）创新服务模式

社会工作在乡村振兴中大有可为。社工要扎根农村、服务农民，运用专业方法和理念，在保障民生、促进发展、改善治理等方面发挥更大作用，为全面推进乡村振兴贡献专业力量。`

// ===== APP STATE =====
let currentTab = 'practice';
let currentQuestion = null;
let currentFilter = 'all';
let timerInterval = null;
let timerSeconds = 0;
let timerRunning = false;
let practiceResults = JSON.parse(localStorage.getItem('sw_practice_results') || '{}');
let wrongQuestions = JSON.parse(localStorage.getItem('sw_wrong_questions') || '[]');
let dialogCallback = null;

// ===== INIT =====
function init() {
  updateStats();
  renderQuestionList();
  renderWrongList();
}

// ===== TAB SWITCHING =====
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  event.target.closest('.tab').classList.add('active');
  document.getElementById(tab + 'Page').classList.add('active');
  document.getElementById('questionView').classList.remove('active');
  if (tab === 'wrong') renderWrongList();
}

// ===== STATS =====
function updateStats() {
  const done = Object.keys(practiceResults).length;
  const scores = Object.values(practiceResults).filter(r => r.score !== undefined).map(r => r.score);
  const avg = scores.length ? Math.round(scores.reduce((a,b) => a+b, 0) / scores.length) : 0;
  document.getElementById('totalDone').textContent = `已做 ${done} 题`;
  document.getElementById('totalWrong').textContent = `错题 ${wrongQuestions.length}`;
  document.getElementById('pDone').textContent = done;
  document.getElementById('pAvg').textContent = avg;
  document.getElementById('pWrong').textContent = wrongQuestions.length;
  const badge = document.getElementById('wrongBadge');
  if (wrongQuestions.length) { badge.style.display = 'inline'; badge.textContent = wrongQuestions.length; }
  else { badge.style.display = 'none'; }
}

// ===== PRACTICE =====
function startPractice(type) {
  let pool = questionBank;
  if (type === 'case') pool = questionBank.filter(q => q.type === 'case');
  else if (type === 'essay') pool = questionBank.filter(q => q.type === 'essay');
  if (!pool.length) return alert('暂无可用题目');
  const q = pool[Math.floor(Math.random() * pool.length)];
  openQuestion(q, true);
}

// ===== QUESTION LIST =====
function renderQuestionList() {
  const list = document.getElementById('questionList');
  let filtered = currentFilter === 'all' ? questionBank : questionBank.filter(q => q.year === currentFilter);
  list.innerHTML = filtered.map(q => {
    const done = practiceResults[q.id];
    return `
    <div class="card">
      <div class="q-list-item" onclick="openQuestion(findQ('${q.id}'), false)">
        <div class="q-title">${q.title}</div>
        <div class="q-meta">
          <span class="tag tag-${q.type}">${q.type === 'case' ? '案例分析' : '论述题'}</span>
          <span class="tag tag-year">${q.year}年</span>
          <span class="tag" style="background:#f3f4f6;color:#374151">${q.points}分</span>
          ${done ? '<span class="tag" style="background:#dcfce7;color:#16a34a">已做</span>' : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function filterYear(year) {
  currentFilter = year;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderQuestionList();
}

function findQ(id) {
  return questionBank.find(q => q.id === id);
}

// ===== QUESTION VIEW =====
function openQuestion(q, isPractice) {
  if (!q) return;
  currentQuestion = q;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const view = document.getElementById('questionView');
  view.classList.add('active');
  view.classList.add('fade-in');

  const isWrongPage = document.getElementById('wrongPage').classList.contains('active');

  // Render question
  document.getElementById('questionCard').innerHTML = `
    <div class="q-header">
      <div>
        <div class="q-number">${q.year}年 · ${q.type === 'case' ? '案例分析题' : '论述题'}</div>
        <div class="card-title">${q.title}</div>
      </div>
      <span class="q-type-badge tag-${q.type}">${q.points}分</span>
    </div>
    <div class="q-body">${q.body}</div>
    <div class="q-requirements">${q.requirements}</div>
  `;

  // Reset answer area
  document.getElementById('answerInput').value = practiceResults[q.id]?.userAnswer || '';
  document.getElementById('refAnswer').classList.remove('show');
  document.getElementById('scoreSelector').classList.remove('show');

  // Wrong button state
  const isWrong = wrongQuestions.find(w => w.id === q.id);
  document.getElementById('wrongBtn').textContent = isWrong ? '移出错题本' : '加入错题本';
  document.getElementById('wrongBtn').className = isWrong ? 'btn btn-danger' : 'btn btn-outline';

  // Timer
  if (isPractice) {
    document.getElementById('timerBar').classList.add('show');
    startTimer();
  } else {
    document.getElementById('timerBar').classList.remove('show');
    stopTimer();
  }
}

function goBack() {
  document.getElementById('questionView').classList.remove('active');
  stopTimer();
  document.getElementById('timerBar').classList.remove('show');
  if (currentTab === 'practice') document.getElementById('practicePage').classList.add('active');
  else if (currentTab === 'basic') { document.getElementById('basicPage').classList.add('active'); renderQuestionList(); }
  else if (currentTab === 'wrong') { document.getElementById('wrongPage').classList.add('active'); renderWrongList(); }
}

// ===== TIMER =====
function startTimer() {
  stopTimer();
  timerSeconds = 0;
  timerRunning = true;
  updateTimerDisplay();
  timerInterval = setInterval(() => { if (timerRunning) { timerSeconds++; updateTimerDisplay(); } }, 1000);
}
function stopTimer() { clearInterval(timerInterval); timerRunning = false; }
function toggleTimer() {
  timerRunning = !timerRunning;
  document.querySelector('#timerBar .btn').textContent = timerRunning ? '暂停' : '继续';
}
function updateTimerDisplay() {
  const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
  const s = String(timerSeconds % 60).padStart(2, '0');
  document.getElementById('timerDisplay').textContent = `${m}:${s}`;
}

// ===== ANSWER & SCORE =====
function showAnswer() {
  if (!currentQuestion) return;
  document.getElementById('refAnswer').classList.add('show');
  document.getElementById('answerContent').textContent = currentQuestion.answer;
  // Show score selector
  const sel = document.getElementById('scoreSelector');
  sel.classList.add('show');
  const maxScore = currentQuestion.points;
  const options = [0, Math.round(maxScore*0.2), Math.round(maxScore*0.4), Math.round(maxScore*0.6), Math.round(maxScore*0.8), maxScore];
  document.getElementById('scoreOptions').innerHTML = options.map(s =>
    `<button class="score-btn" onclick="setScore(${s}, this)">${s}分</button>`
  ).join('');
}

function setScore(score, el) {
  document.querySelectorAll('.score-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  if (!currentQuestion) return;
  practiceResults[currentQuestion.id] = {
    score: score,
    maxScore: currentQuestion.points,
    userAnswer: document.getElementById('answerInput').value,
    date: new Date().toISOString().slice(0, 10),
    timeSpent: timerSeconds
  };
  localStorage.setItem('sw_practice_results', JSON.stringify(practiceResults));
  updateStats();
}

// ===== WRONG QUESTIONS =====
function toggleWrong() {
  if (!currentQuestion) return;
  const idx = wrongQuestions.findIndex(w => w.id === currentQuestion.id);
  if (idx >= 0) {
    wrongQuestions.splice(idx, 1);
    document.getElementById('wrongBtn').textContent = '加入错题本';
    document.getElementById('wrongBtn').className = 'btn btn-outline';
  } else {
    wrongQuestions.push({
      id: currentQuestion.id,
      addedAt: new Date().toISOString().slice(0, 10)
    });
    document.getElementById('wrongBtn').textContent = '移出错题本';
    document.getElementById('wrongBtn').className = 'btn btn-danger';
  }
  localStorage.setItem('sw_wrong_questions', JSON.stringify(wrongQuestions));
  updateStats();
  renderWrongList();
}

function renderWrongList() {
  const list = document.getElementById('wrongList');
  const empty = document.getElementById('wrongEmpty');
  if (!wrongQuestions.length) { list.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  list.innerHTML = wrongQuestions.map(w => {
    const q = findQ(w.id);
    if (!q) return '';
    return `
    <div class="card">
      <div class="q-list-item" onclick="openQuestion(findQ('${q.id}'), false)">
        <div class="q-title">${q.title}</div>
        <div class="q-meta">
          <span class="tag tag-${q.type}">${q.type === 'case' ? '案例分析' : '论述题'}</span>
          <span class="tag tag-year">${q.year}年</span>
          <span class="tag" style="background:#fee2e2;color:#dc2626">收藏于 ${w.addedAt}</span>
        </div>
      </div>
      <div class="wrong-actions">
        <button class="btn btn-sm btn-outline" onclick="event.stopPropagation(); removeFromWrong('${w.id}')">移出错题本</button>
      </div>
    </div>`;
  }).join('');
}

function removeFromWrong(id) {
  showConfirm('确认移出', '确定要将这道题从错题本中移出吗？', () => {
    wrongQuestions = wrongQuestions.filter(w => w.id !== id);
    localStorage.setItem('sw_wrong_questions', JSON.stringify(wrongQuestions));
    updateStats();
    renderWrongList();
    // Update button if viewing this question
    if (currentQuestion && currentQuestion.id === id) {
      document.getElementById('wrongBtn').textContent = '加入错题本';
      document.getElementById('wrongBtn').className = 'btn btn-outline';
    }
  });
}

// ===== CONFIRM DIALOG =====
function showConfirm(title, msg, callback) {
  document.getElementById('dialogTitle').textContent = title;
  document.getElementById('dialogMsg').textContent = msg;
  dialogCallback = callback;
  document.getElementById('confirmDialog').classList.add('show');
}
function closeDialog() { document.getElementById('confirmDialog').classList.remove('show'); dialogCallback = null; }
function confirmAction() { closeDialog(); if (dialogCallback) dialogCallback(); }

// Init
init();
</script>
</body>
</html>
