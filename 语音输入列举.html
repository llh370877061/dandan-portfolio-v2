<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语音输入</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #f5f5f5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  h1 {
    font-size: 22px;
    font-weight: 500;
    color: #333;
    margin-bottom: 30px;
  }
  .btn-row {
    display: flex;
    gap: 12px;
    margin-bottom: 30px;
  }
  button {
    border: none;
    border-radius: 50px;
    padding: 14px 32px;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
  }
  #startBtn {
    background: #ff6b6b;
    color: #fff;
  }
  #startBtn:hover { background: #ee5a5a; }
  #startBtn.recording {
    background: #ff4444;
    animation: pulse 1.2s infinite;
  }
  #clearBtn {
    background: #e0e0e0;
    color: #666;
  }
  #clearBtn:hover { background: #d0d0d0; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,68,68,0.5); }
    50% { box-shadow: 0 0 0 12px rgba(255,68,68,0); }
  }
  .status {
    color: #999;
    font-size: 14px;
    margin-bottom: 20px;
    min-height: 20px;
  }
  .list-container {
    width: 100%;
    max-width: 500px;
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    color: #999;
    font-size: 13px;
  }
  .count {
    background: #f0f0f0;
    padding: 2px 10px;
    border-radius: 10px;
  }
  #list {
    list-style: none;
  }
  #list li {
    padding: 12px 0;
    border-bottom: 1px solid #f0f0f0;
    color: #333;
    font-size: 15px;
    line-height: 1.5;
    display: flex;
    gap: 10px;
  }
  #list li:last-child { border-bottom: none; }
  .num {
    color: #bbb;
    font-size: 13px;
    min-width: 22px;
    padding-top: 1px;
  }
  .empty {
    text-align: center;
    color: #ccc;
    padding: 30px 0;
    font-size: 14px;
  }
</style>
</head>
<body>

<h1>语音输入</h1>

<div class="btn-row">
  <button id="startBtn">开始录音</button>
  <button id="clearBtn">清空</button>
</div>

<div class="status" id="status"></div>

<div class="list-container">
  <div class="list-header">
    <span>识别结果</span>
    <span class="count" id="count">0 条</span>
  </div>
  <ul id="list">
    <li class="empty">点击按钮开始语音输入</li>
  </ul>
</div>

<script>
const startBtn = document.getElementById('startBtn');
const clearBtn = document.getElementById('clearBtn');
const statusEl = document.getElementById('status');
const listEl = document.getElementById('list');
const countEl = document.getElementById('count');

let recognition;
let isRecording = false;
let items = [];

// Check browser support
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SpeechRecognition) {
  statusEl.textContent = '当前浏览器不支持语音识别，请使用 Chrome';
  startBtn.disabled = true;
  startBtn.style.opacity = 0.5;
} else {
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = (e) => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        const text = e.results[i][0].transcript.trim();
        if (text) {
          items.push(text);
          render();
        }
      }
    }
  };

  recognition.onerror = (e) => {
    if (e.error !== 'no-speech') {
      statusEl.textContent = '识别出错：' + e.error;
    }
    stopRecording();
  };

  recognition.onend = () => {
    // Auto-restart if still recording (continuous mode fallback)
    if (isRecording) {
      try { recognition.start(); } catch(e) {}
    }
  };
}

function render() {
  countEl.textContent = items.length + ' 条';
  if (items.length === 0) {
    listEl.innerHTML = '<li class="empty">点击按钮开始语音输入</li>';
    return;
  }
  listEl.innerHTML = items.map((t, i) =>
    `<li><span class="num">${i + 1}.</span><span>${t}</span></li>`
  ).join('');
}

function startRecording() {
  if (!recognition) return;
  isRecording = true;
  startBtn.textContent = '停止录音';
  startBtn.classList.add('recording');
  statusEl.textContent = '正在听你说…';
  try { recognition.start(); } catch(e) {}
}

function stopRecording() {
  isRecording = false;
  startBtn.textContent = '开始录音';
  startBtn.classList.remove('recording');
  statusEl.textContent = '';
  try { recognition.stop(); } catch(e) {}
}

startBtn.addEventListener('click', () => {
  if (isRecording) {
    stopRecording();
  } else {
    startRecording();
  }
});

clearBtn.addEventListener('click', () => {
  items = [];
  render();
});
</script>
</body>
</html>
