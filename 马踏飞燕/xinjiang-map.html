  .hdr a { color:var(--accent); text-decoration:none; font-size:0.88em; }
  .hdr h1 { font-family:"Noto Serif SC",serif; font-size:1.3em; background:linear-gradient(135deg,#c9a96e,#e8d5a3); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

  /* Tabs */
  .tabs { display:flex; gap:2px; padding:8px 20px; background:var(--card); border-bottom:1px solid var(--border); overflow-x:auto; }
  .tab { padding:10px 20px; border-radius:10px; font-size:0.88em; font-weight:600; cursor:pointer; transition:all 0.2s; white-space:nowrap; color:var(--muted); background:transparent; border:none; }
  .tab:hover { color:var(--text); background:rgba(201,169,110,0.08); }
  .tab.active { color:#0a0a0f; background:var(--accent); }

  /* Map */
  #map { width:100%; height:calc(100vh - 100px); }

  /* Loading */
  #loading { position:fixed; top:0;left:0;right:0;bottom:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; transition:opacity 0.5s; }
  #loading.hide { opacity:0; pointer-events:none; }
  .spinner { width:36px;height:36px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.7s linear infinite; }
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading p { margin-top:14px; color:var(--muted); font-size:0.85em; }

  /* Legend */
  .legend { position:absolute; bottom:20px; left:14px; z-index:800; background:rgba(20,20,31,0.95); border:1px solid var(--border); border-radius:10px; padding:14px; backdrop-filter:blur(10px); }
  .legend h4 { font-size:0.82em; color:var(--accent); margin-bottom:8px; }
  .li { display:flex; align-items:center; gap:7px; font-size:0.78em; color:var(--muted); margin-bottom:4px; }
  .dot { width:10px;height:10px; border-radius:50%; flex-shrink:0; }

  /* Info panel */
  .info-panel { position:absolute; top:10px; right:14px; z-index:800; background:rgba(20,20,31,0.95); border:1px solid var(--border); border-radius:10px; padding:14px; width:240px; backdrop-filter:blur(10px); font-size:0.82em; color:var(--muted); line-height:1.7; }
  .info-panel h4 { color:var(--accent); margin-bottom:6px; font-size:0.9em; }
  .info-panel .hi { color:#ccc; }

  /* Popup */
  .leaflet-popup-content-wrapper { background:rgba(20,20,31,0.95)!important; color:var(--text)!important; border-radius:10px!important; border:1px solid var(--border)!important; }
  .leaflet-popup-tip { background:rgba(20,20,31,0.95)!important; }
  .pt { font-family:"Noto Serif SC",serif; font-size:1em; font-weight:700; color:var(--accent); margin-bottom:4px; }
  .pi { font-size:0.82em; color:#bbb; line-height:1.6; }
  .tg { display:inline-block; padding:2px 8px; border-radius:6px; font-size:0.72em; margin-right:4px; margin-top:3px; }

  {a:'喀什',b:'阿克苏',km:470,t:'飞1h / 火车8h'},
  {a:'喀什',b:'和田',km:510,t:'火车8h'},
  {a:'阿克苏',b:'库车',km:260,t:'火车3h'},
  {a:'库尔勒',b:'乌鲁木齐',km:470,t:'火车6h'},

  {a:'伊宁',b:'那拉提',km:270,t:'大巴4.5h'},

// 路线
const routeData={
  south:{name:'南疆经典线',color:'#c9a96e',coords:[[39.47,75.99],[38.78,75.15],[38.43,75.05],[37.77,75.23],[37.72,75.28],[38.43,75.05],[39.47,75.99]],desc:'喀什→白沙湖→喀拉库勒湖→塔县→盘龙古道→喀什'},
  north:{name:'北疆经典线',color:'#2ecc71',coords:[[43.83,87.62],[47.75,88.09],[47.70,86.86],[48.68,87.42],[49.04,86.68],[47.70,86.86],[46.10,85.72],[43.83,87.62]],desc:'乌鲁木齐→阿勒泰→布尔津→禾木→白哈巴→五彩滩→魔鬼城→乌鲁木齐'},
  yili:{name:'伊犁草原线',color:'#3498db',coords:[[43.83,87.62],[44.58,81.33],[43.91,81.33],[43.25,82.85],[43.32,84.02],[42.93,84.17],[43.83,87.62]],desc:'乌鲁木齐→赛里木湖→伊宁→库尔德宁→那拉提→巴音布鲁克→乌鲁木齐'},
  loop:{name:'南北疆大环线',color:'#9b59b6',coords:[[43.83,87.62],[47.75,88.09],[48.68,87.42],[46.10,85.72],[43.83,87.62],[43.91,81.33],[42.93,84.17],[41.73,86.12],[41.17,80.26],[39.47,75.99],[37.77,75.23],[37.14,79.93],[43.83,87.62]],desc:'乌鲁木齐→北疆→伊犁→南疆→和田→喀什→塔县→乌鲁木齐'},
};

// ===== 渲染 =====
const allLayers={};
function addLayer(k,l){allLayers[k]=l;}
function clearAll(){Object.values(allLayers).forEach(l=>{if(map.hasLayer(l))map.removeLayer(l);});}

function renderCityMarkers(){
  cities.forEach(c=>{
    const sz=c.big?18:12;
    const em=c.big?'🏛️':'🏘️';
    L.marker([c.lat,c.lng],{icon:L.divIcon({html:`<div style="text-align:center;"><div style="font-size:${sz}px;">${em}</div><div style="font-size:${c.big?11:9}px;color:rgba(201,169,110,${c.big?0.8:0.5});white-space:nowrap;font-weight:${c.big?700:400};">${c.n}</div></div>`,className:'',iconSize:[50,28],iconAnchor:[25,14]}),interactive:false}).addTo(map);
  });
}

function renderAirports(){
  const lg=L.layerGroup();
  airports.forEach(a=>{
    L.marker([a.lat,a.lng],{icon:ico('✈️',22)}).bindPopup(`<div class="pt">${a.n}</div><div class="pi"><span class="tg" style="background:rgba(231,76,60,0.2);color:#e74c3c;">${a.c}</span><span class="tg" style="background:rgba(107,140,206,0.2);color:#6b8cce;">${a.l}</span><br>${a.d}</div>`).addTo(lg);
  });
  addLayer('airport',lg);return lg;
}

function renderTrains(){
  const lg=L.layerGroup();
  trains.forEach(t=>{
    L.marker([t.lat,t.lng],{icon:ico('🚄',20)}).bindPopup(`<div class="pt">${t.n}</div><div class="pi"><span class="tg" style="background:rgba(52,152,219,0.2);color:#3498db;">火车站</span><br>${t.d}</div>`).addTo(lg);
  });
  addLayer('train',lg);return lg;
}

function renderBuses(){
  const lg=L.layerGroup();
  busStations.forEach(b=>{
    L.marker([b.lat,b.lng],{icon:ico('🚌',18)}).bindPopup(`<div class="pt">${b.n}</div><div class="pi"><span class="tg" style="background:rgba(46,204,113,0.2);color:#2ecc71;">汽车站</span><br>${b.d}</div>`).addTo(lg);
  });
  addLayer('bus',lg);return lg;
}

function renderScenic(filter){
  const lg=L.layerGroup();
  const items=filter?scenic.filter(s=>s.r===filter):scenic;
  items.forEach(s=>{
    const regionLabel=s.r==='south'?'南疆':s.r==='north'?'北疆':'伊犁';
    L.marker([s.lat,s.lng],{icon:ico('🏔️',22)}).bindPopup(`<div class="pt">${s.n}</div><div class="pi"><span class="tg" style="background:rgba(243,156,18,0.2);color:#f39c12;">${s.s}</span><span class="tg" style="background:rgba(201,169,110,0.15);color:#c9a96e;">${regionLabel}</span><br>${s.d}</div>`).addTo(lg);
  });
  addLayer('scenic-'+(filter||'all'),lg);return lg;
}

function renderHighways(filter){
  const lg=L.layerGroup();
  const items=filter?highways.filter(h=>{
    if(filter==='south')return h.n.includes('G314')||h.n.includes('G315')||h.n.includes('G3012');
    if(filter==='north')return h.n.includes('G30')||h.n.includes('G217');
    if(filter==='yili')return h.n.includes('G218')||h.n.includes('独库');
    return true;
  }):highways;
  items.forEach(h=>{
    L.polyline(h.coords,{color:h.color,weight:3,opacity:0.7}).bindPopup(`<div class="pt" style="color:${h.color};">${h.n}</div><div class="pi">${h.d}</div>`).addTo(lg);
  });
  addLayer('highway-'+(filter||'all'),lg);return lg;
}

function renderDanger(filter){
  const lg=L.layerGroup();
  const items=filter?dangerRoads.filter(d=>{
    const lat=d.lat;
    if(filter==='south')return lat<40;
    if(filter==='north')return lat>45;
    if(filter==='yili')return lat>=42&&lat<=44.5&&d.lng<85;
    return true;
  }):dangerRoads;
  items.forEach(d=>{
    L.circle([d.lat,d.lng],{radius:d.r,color:d.color,fillColor:d.color,fillOpacity:0.15,weight:1,dashArray:'5,5'}).bindPopup(`<div class="pt" style="color:#e74c3c;">⚠️ ${d.n}</div><div class="pi">${d.d}</div>`).addTo(lg);
  });
  addLayer('danger-'+(filter||'all'),lg);return lg;
}

function renderDistances(){
  const lg=L.layerGroup();
  distInfo.forEach(d=>{
    const cA=cities.find(c=>c.n===d.a),cB=cities.find(c=>c.n===d.b);
    if(!cA||!cB)return;
    const mLat=(cA.lat+cB.lat)/2,mLng=(cA.lng+cB.lng)/2;
    L.marker([mLat,mLng],{icon:L.divIcon({html:`<div style="background:rgba(10,10,15,0.8);padding:2px 7px;border-radius:5px;font-size:10px;color:#c9a96e;white-space:nowrap;border:1px solid rgba(201,169,110,0.2);">${d.km}km·${d.t}</div>`,className:'',iconSize:[0,0]}),interactive:false}).addTo(lg);
  });
  addLayer('dist',lg);return lg;
}

// ===== 视图切换 =====
function switchView(v){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>{if(t.textContent.includes(v==='overview'?'概览':v==='south'?'南疆':v==='north'?'北疆':v==='yili'?'伊犁':'大环线'))t.classList.add('active');});

  clearAll();
  const centerMap={overview:[41.5,86,6],south:[38.5,76,7],north:[47,87,7],yili:[43.5,83,7],loop:[42,83,6]};
  const [lat,lng,z]=centerMap[v];
  map.setView([lat,lng],z);

  const legendEl=document.getElementById('legend');
  const infoEl=document.getElementById('infoPanel');

  if(v==='overview'){
    renderCityMarkers();
    const a=renderAirports(),tr=renderTrains(),b=renderBuses();
    renderHighways();
    renderDanger();
    renderDistances();
    a.addTo(map);tr.addTo(map);b.addTo(map);
    legendEl.innerHTML=`<h4>图例</h4><div class="li"><div class="dot" style="background:#e74c3c;"></div>机场</div><div class="li"><div class="dot" style="background:#3498db;"></div>火车站</div><div class="li"><div class="dot" style="background:#2ecc71;"></div>汽车站</div><div class="li"><div class="dot" style="background:#e67e22;"></div>高速公路</div><div class="li"><div class="dot" style="background:#e74c3c;opacity:0.4;"></div>危险区域</div><div class="li"><div class="dot" style="background:#c9a96e;"></div>距离标注</div>`;
    infoEl.innerHTML=`<h4>🗺️ 全疆概览</h4><p class="hi">显示新疆所有主要交通枢纽（机场12个、火车站13个、汽车站8个）及高速公路网络。</p><p style="margin-top:8px;">点击任意标注查看详情。点击右下角图标可查看危险路段。</p>`;
  } else if(v==='south'){
    renderCityMarkers();
    const a=renderAirports(),tr=renderTrains(),b=renderBuses(),sc=renderScenic('south'),hw=renderHighways('south'),dg=renderDanger('south'),dt=renderDistances();
    a.addTo(map);tr.addTo(map);b.addTo(map);sc.addTo(map);hw.addTo(map);dg.addTo(map);dt.addTo(map);
    legendEl.innerHTML=`<h4>南疆</h4><div class="li"><div class="dot" style="background:#e74c3c;"></div>机场</div><div class="li"><div class="dot" style="background:#3498db;"></div>火车站</div><div class="li"><div class="dot" style="background:#f39c12;"></div>景点</div><div class="li"><div class="dot" style="background:#c9a96e;"></div>G314喀喇昆仑公路</div><div class="li"><div class="dot" style="background:#9b59b6;"></div>G315喀什→和田</div><div class="li"><div class="dot" style="background:#e74c3c;opacity:0.4;"></div>危险路段</div>`;
    infoEl.innerHTML=`<h4>🏜️ 南疆板块</h4><p class="hi">以喀什为中心，覆盖帕米尔高原、塔克拉玛干沙漠、和田。重点标注G314喀喇昆仑公路（喀什→塔县→红其拉甫）及沿途危险路段。</p><p style="margin-top:8px;"><strong>必看景点：</strong>喀什古城、白沙湖、喀拉库勒湖、盘龙古道、库车大峡谷</p>`;
  } else if(v==='north'){
    renderCityMarkers();
    const a=renderAirports(),tr=renderTrains(),b=renderBuses(),sc=renderScenic('north'),hw=renderHighways('north'),dg=renderDanger('north'),dt=renderDistances();
    a.addTo(map);tr.addTo(map);b.addTo(map);sc.addTo(map);hw.addTo(map);dg.addTo(map);dt.addTo(map);
    legendEl.innerHTML=`<h4>北疆</h4><div class="li"><div class="dot" style="background:#e74c3c;"></div>机场</div><div class="li"><div class="dot" style="background:#3498db;"></div>火车站</div><div class="li"><div class="dot" style="background:#f39c12;"></div>景点</div><div class="li"><div class="dot" style="background:#e67e22;"></div>G30连霍高速</div><div class="li"><div class="dot" style="background:#2ecc71;"></div>G217阿勒泰→和田</div>`;
    infoEl.innerHTML=`<h4>🌲 北疆板块</h4><p class="hi">以阿勒泰为中心，覆盖喀纳斯、禾木、白哈巴、魔鬼城、可可托海。G30连霍高速横贯北疆。</p><p style="margin-top:8px;"><strong>必看景点：</strong>喀纳斯湖、禾木村、五彩滩、魔鬼城、可可托海</p>`;
  } else if(v==='yili'){
    renderCityMarkers();
    const a=renderAirports(),tr=renderTrains(),b=renderBuses(),sc=renderScenic('yili'),hw=renderHighways('yili'),dg=renderDanger('yili'),dt=renderDistances();
    a.addTo(map);tr.addTo(map);b.addTo(map);sc.addTo(map);hw.addTo(map);dg.addTo(map);dt.addTo(map);
    legendEl.innerHTML=`<h4>伊犁</h4><div class="li"><div class="dot" style="background:#3498db;"></div>G218伊宁→若羌</div><div class="li"><div class="dot" style="background:#1abc9c;"></div>独库公路</div><div class="li"><div class="dot" style="background:#f39c12;"></div>景点</div><div class="li"><div class="dot" style="background:#e67e22;opacity:0.4;"></div>伊昭公路（限5座）</div>`;
    infoEl.innerHTML=`<h4>🌿 伊犁板块</h4><p class="hi">伊犁河谷草原环线。赛里木湖→那拉提→巴音布鲁克→独库公路。独库公路6-10月开放，限7座以下。</p><p style="margin-top:8px;"><strong>必看景点：</strong>赛里木湖、那拉提草原、巴音布鲁克、库尔德宁</p>`;
  } else if(v==='loop'){
    renderCityMarkers();
    const sc=renderScenic(),hw=renderHighways(),dg=renderDanger(),dt=renderDistances();
    sc.addTo(map);hw.addTo(map);dg.addTo(map);dt.addTo(map);
    const lg=L.layerGroup();
    Object.values(routeData).forEach(r=>{
      L.polyline(r.coords,{color:r.color,weight:3.5,opacity:0.8,dashArray:r.color==='#9b59b6'?'8,8':null}).bindPopup(`<div class="pt" style="color:${r.color};">${r.name}</div><div class="pi">${r.desc}</div>`).addTo(lg);
    });
    lg.addTo(map);addLayer('routes',lg);
    legendEl.innerHTML=`<h4>大环线</h4><div class="li"><div class="dot" style="background:#c9a96e;"></div>南疆经典线</div><div class="li"><div class="dot" style="background:#2ecc71;"></div>北疆经典线</div><div class="li"><div class="dot" style="background:#3498db;"></div>伊犁草原线</div><div class="li"><div class="dot" style="background:#9b59b6;"></div>南北疆大环线</div>`;
    infoEl.innerHTML=`<h4>🔄 大环线</h4><p class="hi">四条主要线路总览。虚线为南北疆大环线（约3000km，建议15-20天）。</p><p style="margin-top:8px;"><strong>你选哪条？</strong>告诉我你的天数和偏好，我来帮你规划。</p>`;
  }
}

// ===== 初始化 =====
renderCityMarkers();
const la=renderAirports(),lt=renderTrains(),lb=renderBuses();
renderHighways();renderDanger();renderDistances();
la.addTo(map);lt.addTo(map);lb.addTo(map);

document.getElementById('legend').innerHTML=`<h4>图例</h4><div class="li"><div class="dot" style="background:#e74c3c;"></div>机场</div><div class="li"><div class="dot" style="background:#3498db;"></div>火车站</div><div class="li"><div class="dot" style="background:#e67e22;"></div>高速公路</div><div class="li"><div class="dot" style="background:#e74c3c;opacity:0.4;"></div>危险路段</div><div class="li"><div class="dot" style="background:#c9a96e;"></div>距离标注</div>`;
document.getElementById('infoPanel').innerHTML=`<h4>🗺️ 全疆概览</h4><p class="hi">新疆所有主要交通枢纽及高速公路网络。点击标注查看详情。</p>`;

setTimeout(()=>{const l=document.getElementById('loading');l.classList.add('hide');setTimeout(()=>l.remove(),600);},1000);
</script>
